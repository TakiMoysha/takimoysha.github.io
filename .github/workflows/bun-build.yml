name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # - name: Restore cache
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       node_modules
      #       .nuxt
      #     key: ${{ runner.os }}-nuxt-${{ hashFiles('bun.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-nuxt-

      - run: bun install --frozen-lock

      - name: Static HTML export with Nuxt
        run: bun run build
        env:
          NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NUXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NUXT_PUBLIC_BING_SITE_VERIFICATION }}

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
