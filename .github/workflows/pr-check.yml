name: Check PR before merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-nuxt-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-

      - run: bun install
      - run: bun run lint

  build:
    uses: ./.github/workflows/bun-build.yml
